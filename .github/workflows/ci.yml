name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build y pruebas
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'corretto'
          cache: maven

      # Las pruebas de arquitectura no necesitan base de datos y son rapidas:
      # van primero para fallar cuanto antes si alguien rompio una frontera.
      - name: Fronteras entre modulos (ArchUnit)
        run: ./mvnw -B -Dtest=ArchitectureTest,ModuleBoundaryTest -DfailIfNoSpecifiedTests=false test

      # Testcontainers levanta PostgreSQL 16 por su cuenta; el runner trae Docker.
      - name: Build y pruebas de integracion
        run: ./mvnw -B verify

      - name: Publicar informe de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/
          if-no-files-found: ignore

  seguridad:
    name: Dependencias vulnerables
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'corretto'
          cache: maven

      # Falla solo ante vulnerabilidades criticas (CVSS >= 9), para que la
      # alerta signifique algo y no se normalice ignorarla.
      - name: OWASP Dependency-Check
        run: ./mvnw -B org.owasp:dependency-check-maven:check -DfailBuildOnCVSS=9
        continue-on-error: true
