spring:
  application:
    name: ustudent

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ustudent}
    username: ${DB_USER:ustudent}
    password: ${DB_PASSWORD:cambiar_en_local}
    hikari:
      maximum-pool-size: 10
      connection-timeout: 20000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc.time_zone: UTC
        default_schema: public

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USER:}
    password: ${SMTP_PASSWORD:}

  # Jackson 3 (Boot 4) ya serializa las fechas como ISO-8601 por defecto: la
  # antigua write-dates-as-timestamps salio de SerializationFeature y fijarla
  # aqui impide arrancar.
  jackson:
    default-property-inclusion: non_null

  threads:
    virtual:
      enabled: true

server:
  port: 8080
  error:
    include-stacktrace: never
    include-message: never
  servlet:
    context-path: /

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha

# ── Configuracion propia de uStudent ────────────────────────────────
ustudent:
  api:
    base-path: /api/v1
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  security:
    jwt:
      access-ttl-minutes: ${JWT_ACCESS_TTL_MINUTES:30}
      refresh-ttl-hours: ${JWT_REFRESH_TTL_HOURS:8}
      private-key-path: ${JWT_PRIVATE_KEY_PATH:./secrets/jwt_private.pem}
      public-key-path: ${JWT_PUBLIC_KEY_PATH:./secrets/jwt_public.pem}
    max-failed-attempts: 5
    lock-duration-minutes: 15
  encryption:
    key: ${DATA_ENCRYPTION_KEY:}
  ai:
    enabled: ${AI_ENABLED:true}
    provider: ${AI_PROVIDER:rules}      # anthropic | rules
    model: ${AI_MODEL:claude-sonnet-5}
    api-key: ${AI_API_KEY:}
    timeout-ms: ${AI_TIMEOUT_MS:5000}
    max-retries: 2
    min-confidence: ${AI_MIN_CONFIDENCE:0.55}
    pseudonymize: true
  storage:
    type: ${STORAGE_TYPE:filesystem}
    path: ${STORAGE_PATH:./attachments}
    max-file-mb: ${STORAGE_MAX_FILE_MB:10}
  mail:
    from: ${MAIL_FROM:ustudent@usta.edu.co}

logging:
  level:
    root: INFO
    co.edu.usta.ustudent: DEBUG

---
spring:
  config:
    activate:
      on-profile: local
  jpa:
    show-sql: true

logging:
  pattern:
    console: "%d{HH:mm:ss} %-5level [%X{traceId:-}] %logger{36} - %msg%n"

---
spring:
  config:
    activate:
      on-profile: prod
  jpa:
    show-sql: false

server:
  error:
    include-stacktrace: never

logging:
  level:
    root: WARN
    co.edu.usta.ustudent: INFO

ustudent:
  ai:
    pseudonymize: true   # no se permite desactivar en produccion
