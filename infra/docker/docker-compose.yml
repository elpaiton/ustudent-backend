services:
  db:
    image: postgres:16-alpine
    container_name: ustudent-db
    environment:
      POSTGRES_DB: ustudent
      POSTGRES_USER: ustudent
      POSTGRES_PASSWORD: ${DB_PASSWORD:-cambiar_en_local}
      TZ: America/Bogota
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ../db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ustudent -d ustudent"]
      interval: 10s
      timeout: 5s
      retries: 5

  mail:
    image: axllent/mailpit:latest
    container_name: ustudent-mail
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # interfaz web
    environment:
      MP_MAX_MESSAGES: 500

  # Descomentar para probar el almacenamiento de adjuntos en S3.
